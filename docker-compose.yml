name: careerpilot-ai



services:

  mysql:

    image: mysql:8.4

    container_name: careerpilot-mysql

    environment:

      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: careerpilot

      MYSQL_USER: careerpilot

      MYSQL_PASSWORD: careerpilot

    ports:

      - "3307:3306"

    volumes:

      - mysql_data:/var/lib/mysql

    networks:

      - careerpilot-network

    restart: unless-stopped

    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

    healthcheck:

      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucareerpilot", "-pcareerpilot"]

      interval: 5s

      timeout: 5s

      retries: 10

      start_period: 20s



  qdrant:

    image: qdrant/qdrant:latest

    container_name: careerpilot-qdrant

    ports:

      - "6333:6333"

      - "6334:6334"

    volumes:

      - qdrant_storage:/qdrant/storage

    networks:

      - careerpilot-network

    restart: unless-stopped



volumes:

  mysql_data:

  qdrant_storage:



networks:

  careerpilot-network:

